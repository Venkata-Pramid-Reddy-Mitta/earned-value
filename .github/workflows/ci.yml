name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Install WITHOUT the viz extra on purpose. matplotlib is only used by the
      # evidence script, never by the tool or the metrics path, so a green run here
      # proves the metrics path has no hidden dependency on it (traps rule 1).
      - name: Install (no viz extra)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests experiments tools

      - name: Tests (as their own step)
        run: |
          python -m pytest -q \
            --junitxml=reports/junit.xml \
            --cov=earned_value \
            --cov-report=json:reports/coverage.json \
            --cov-report=term-missing

      - name: Coverage floor
        run: |
          python - <<'PY'
          import json, sys
          pct = json.load(open("reports/coverage.json"))["totals"]["percent_covered"]
          print(f"coverage {pct:.2f}%")
          sys.exit(0 if pct >= 95.0 else 1)
          PY

      - name: Receipts (re-measure and check every published figure)
        run: |
          python tools/collect_metrics.py --skip-tests
          python tools/check_numbers.py

      - name: Publish the awkward table to the job summary
        if: always()
        run: |
          python - <<'PY'
          import json, os
          m = json.load(open("docs/metrics.json"))["display"]
          rows = [
              ("Illusion weeks (burn healthy, SPI < 0.95)", m["illusion_weeks"]),
              ("Worst concealed slip", m["worst_slip_dollars"] + " at week " + m["worst_slip_week"]),
              ("Final cost overrun", m["overrun_dollars"] + " (" + m["overrun_pct"] + ")"),
              ("Final CPI", m["final_cpi"]),
              ("SPI at completion (the blind spot)", m["spi_completion"] + " in week " + m["completion_week"]),
              ("Tests / coverage", m["tests_total"] + " tests, " + m["coverage_line_pct"] + "%"),
          ]
          out = ["| What the burn chart could not show | Value |", "|---|---|"]
          out += [f"| {k} | {v} |" for k, v in rows]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(out) + "\n"
          if summary:
              open(summary, "a").write(text)
          print(text)
          PY

      - name: Upload reports and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: receipts-${{ matrix.python-version }}
          path: |
            reports/
            docs/metrics.json
            docs/experiments/
