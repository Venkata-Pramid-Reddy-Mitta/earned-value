[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "earned-value"
version = "0.1.0"
description = "Earned value analysis that splits a program's spend gap into a cost effect and a schedule effect, and flags the weeks a burn chart reads healthy while delivery is already late."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Venkata Pramid Reddy Mitta" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Build-time only: the evidence chart. Never imported by the metrics path,
# so the no-extras CI job proves the tool runs without it.
viz = ["matplotlib>=3.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
]

[project.scripts]
earned-value = "earned_value.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Experiments insert their own directory on sys.path before importing the shared
# helper, so the module-level imports that follow are deliberately not at the top.
"experiments/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
